<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мои пройденные игры</title>
<style>
  :root{
    --bg:#0e0e10;
    --panel:rgba(20,21,25,0.75);
    --panel-2:rgba(35,37,44,0.85);
    --text:#f2f3f5;
    --muted:#a0a2aa;
    --border:rgba(255,255,255,0.12);
    --line:rgba(255,255,255,0.18);
  }
  *{box-sizing:border-box}
  html{background-color:var(--bg)}

  body{
    margin:0; padding:40px 20px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ФОН */
  body::before{
    content:'';
    position:fixed;
    top:-10px; left:-10px; right:-10px; bottom:-10px;
    background-image:url('bg.jpg');
    background-color:#0e0e10;
    background-size:cover;
    background-position:center;
    z-index:-2;
    filter:blur(6px);
    -webkit-filter:blur(6px);
  }

  /* Затемнение */
  body::after{
    content:'';
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(14,14,16,0.7);
    z-index:-1;
  }

  .wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

  /* Шапка */
  .header-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:26px;
    min-height:34px;
  }

  .title{
    margin:0;
    font-size:34px;
    font-weight:600;
    letter-spacing:0.5px;
    color:#ffffff;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
    text-align:center;
    line-height:1.2;
  }

  /* Статистика */
  .stats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:22px;
  }
  .stat{
    background:var(--panel);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.25);
    padding:10px 18px;
    border-radius:12px;
    min-width:120px;
    text-align:center;
    box-shadow:0 0 10px rgba(255,255,255,0.08),
               inset 0 0 5px rgba(255,255,255,0.05),
               0 8px 32px rgba(0,0,0,0.3);
    flex:1;
  }
  .stat b{
    display:block;
    font-size:20px;
    color:#ffffff;
    margin-bottom:2px;
    text-shadow:0 0 8px rgba(255,255,255,0.4);
  }
  .stat span{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.8px;
  }

  /* Таблица */
  .table-box{
    background:var(--panel);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);
    border-radius:18px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    box-shadow:0 24px 60px rgba(0,0,0,0.5);
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    min-width:720px;
    table-layout:fixed;
  }

  thead th{
    background:rgba(255,255,255,0.05);
    color:#dfe1e6;
    text-align:left;
    padding:14px 12px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:600;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }

  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }

  tbody tr:hover{background:rgba(255,255,255,0.08)}
  tbody tr.stripe:not(.subgroup-row){background:rgba(255,255,255,0.02)}
  tbody tr:last-child td{border-bottom:none}

  /* Колонки */
  .cell-val{
    line-height:1.35;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:pre-wrap;
  }

  .col-idx{width:4%; color:var(--muted); font-weight:600; text-align:center}
  .col-name{width:26%}
  .col-score{width:9%; text-align:center}
  .col-status{width:15%}
  .col-notes{width:27%}
  .col-customer{width:19%}

  /* Статус (только отображение) */
  select.status{
    background:transparent;
    color:var(--text);
    border:1px solid transparent;
    border-radius:6px;
    padding:6px 0;
    font-size:12.5px;
    width:100%;
    outline:none;
    font-family:inherit;
    -webkit-appearance:none;
    -moz-appearance:none;
    appearance:none;
    cursor:default;
    opacity:1;
  }
  select.status[data-status="Пройдена"]{color:#ffffff}
  select.status[data-status="Брошена"]{color:#8b8d94}
  select.status[data-status="В процессе"]{color:#e6e8ec; font-weight:600}

  /* Подсветка строки «В процессе» */
  tbody tr.row-progress{
    background:linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 0 24px rgba(255,255,255,.15);
  }
  tbody tr.row-progress td{
    border-top:1px solid rgba(255,255,255,.2);
    border-bottom:1px solid rgba(255,255,255,.2);
  }
  tbody tr.row-progress td:nth-child(2){
    box-shadow:inset 3px 0 0 #ffffff;
    color:#ffffff;
  }

  /* Строки DLC / обновлений */
  tbody tr.subgroup-row{background:rgba(255,255,255,0.015)}
  tbody tr.subgroup-row:hover{background:rgba(255,255,255,.05)}
  tbody tr.subgroup-row td{padding-top:6px; padding-bottom:6px; font-size:13px}
  tbody tr.subgroup-row td:nth-child(2){
    color:var(--muted);
    font-size:16px;
    padding-left:18px;
    text-align:left;
    box-shadow:inset 2px 0 0 rgba(255,255,255,0.08);
  }
  tbody tr.subgroup-row .col-name .cell-val{
    padding-left:2px;
    font-weight:400;
    color:#d8dae0;
  }

  /* Мобильная версия */
  @media (max-width:820px){
    body{padding:20px 10px}
    .header-bar{margin-bottom:20px}
    .title{font-size:28px}
    .stats{gap:8px; margin-bottom:18px}
    .stat{padding:8px 10px; min-width:calc(50% - 8px); border-radius:8px}
    .stat b{font-size:16px}
    .stat span{font-size:9px}
    thead th, tbody td{padding:8px 6px}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-bar">
    <h1 class="title">Мои игры</h1>
  </div>

  <div class="stats">
    <div class="stat"><b id="statTotal">0</b><span>Всего</span></div>
    <div class="stat"><b id="statDone">0</b><span>Пройдено</span></div>
    <div class="stat"><b id="statAvg">—</b><span>Ср. балл</span></div>
  </div>

  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th class="col-idx">#</th>
          <th class="col-name">Название</th>
          <th class="col-score">Оценка</th>
          <th class="col-status">Статус</th>
          <th class="col-notes">Заметки</th>
          <th class="col-customer">Заказчик</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// ==========================================
// НАСТРОЙКА ОБЛАЧНОГО API (Google Sheets)
// ==========================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzrJESZkLj2J4iWDEAaeSQzLEjpcRvs9Gg5wBdJRJFtTq8DwnBDDh-fZ6rZgHNbJOsI/exec';

const tbody = document.getElementById('tbody');

let idCounter = 1;
function genId(){ return 'g_' + (idCounter++) + '_' + Date.now().toString(36); }

function makeCell(text, cls){
  const td = document.createElement('td');
  if (cls) td.className = cls;
  const div = document.createElement('div');
  div.className = 'cell-val';
  div.textContent = text;
  td.appendChild(div);
  return td;
}

function addRow(data){
  const tr = document.createElement('tr');
  tr.dataset.id = data?.id || genId();
  tr.dataset.parent = data?.parentId || '';
  const isSubgroup = !!data?.parentId;

  if (isSubgroup) tr.classList.add('subgroup-row');

  // №
  const idx = document.createElement('td');
  idx.className = 'col-idx';
  idx.textContent = isSubgroup ? '↳' : '';
  tr.appendChild(idx);

  // Название / Оценка
  tr.appendChild(makeCell(data?.name || '', 'col-name'));
  tr.appendChild(makeCell(data?.score || '', 'col-score'));

  // Статус (только отображение)
  const tdStatus = document.createElement('td');
  tdStatus.className = 'col-status';
  const sel = document.createElement('select');
  sel.className = 'status';
  ['Пройдена', 'Брошена', 'В процессе'].forEach(s => {
    const o = document.createElement('option');
    o.value = o.textContent = s;
    sel.appendChild(o);
  });
  sel.value = data?.status || 'Пройдена';
  sel.dataset.status = sel.value;
  sel.disabled = true;
  tdStatus.appendChild(sel);
  tr.appendChild(tdStatus);

  // Заметки / Заказчик
  tr.appendChild(makeCell(data?.notes || '', 'col-notes'));
  tr.appendChild(makeCell(data?.customer || '', 'col-customer'));

  if (sel.value === 'В процессе') tr.classList.add('row-progress');

  tbody.appendChild(tr);
  return tr;
}

function sortRows(){
  const allRows = [...tbody.querySelectorAll('tr[data-id]')];
  const mainRows = allRows.filter(tr => !tr.dataset.parent);
  const subRows  = allRows.filter(tr => tr.dataset.parent);

  mainRows.sort((a, b) => {
    const statusA = a.querySelector('.status').value;
    const statusB = b.querySelector('.status').value;
    const scoreA = parseFloat(a.querySelector('.col-score .cell-val').textContent) || 0;
    const scoreB = parseFloat(b.querySelector('.col-score .cell-val').textContent) || 0;
    if (statusA === 'В процессе' && statusB !== 'В процессе') return -1;
    if (statusA !== 'В процессе' && statusB === 'В процессе') return 1;
    return scoreB - scoreA;
  });

  tbody.innerHTML = '';
  let num = 1, stripeIdx = 0;

  mainRows.forEach(main => {
    main.querySelector('.col-idx').textContent = num++;
    main.classList.toggle('stripe', stripeIdx % 2 === 1);
    stripeIdx++;
    tbody.appendChild(main);

    const children = subRows.filter(s => s.dataset.parent === main.dataset.id);
    children.sort((a, b) => {
      const scoreA = parseFloat(a.querySelector('.col-score .cell-val').textContent) || 0;
      const scoreB = parseFloat(b.querySelector('.col-score .cell-val').textContent) || 0;
      return scoreB - scoreA;
    });
    children.forEach(c => tbody.appendChild(c));
  });
}

function updateStats(){
  const mainRows = [...tbody.querySelectorAll('tr[data-id]:not(.subgroup-row)')];
  const total = mainRows.length;
  const done = mainRows.filter(tr => tr.querySelector('.status').value === 'Пройдена').length;
  const scores = mainRows
    .map(tr => parseFloat(tr.querySelector('.col-score .cell-val').textContent))
    .filter(n => !isNaN(n));
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '—';

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statAvg').textContent = avg;
}

async function loadFromCloud(){
  try {
    const response = await fetch(API_URL, { method: 'GET', redirect: 'follow' });
    if (!response.ok) throw new Error('Ошибка сети');

    const data = await response.json();
    tbody.innerHTML = '';

    if (Array.isArray(data) && data.length > 0) {
      data.forEach(d => addRow(d));
    } else {
      const g1 = genId();
      addRow({ id: g1, parentId: null, name: 'The Witcher 3', score: '10', status: 'Пройдена', notes: 'Геральт навсегда', customer: 'CD Projekt' });
      addRow({ id: genId(), parentId: g1, name: 'Blood and Wine', score: '10', status: 'Пройдена', notes: 'Лучшее DLC', customer: 'CD Projekt' });
    }

    sortRows();
    updateStats();
  } catch (error) {
    console.error('❌ Ошибка загрузки:', error);
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#ff8080;">Не удалось загрузить данные из облака. Проверьте интернет.</td></tr>';
  }
}

// ==========================================
// ЗАПУСК
// ==========================================
loadFromCloud();
</script>

</body>
</html>
